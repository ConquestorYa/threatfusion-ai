name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "local-development/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-first-run:
    name: Linux first run (${{ matrix.distribution }}, no Python/Git)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        distribution: ["debian:bookworm-slim", "ubuntu:24.04"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build clean non-root Linux fixture
        run: |
          docker build --build-arg DISTRIBUTION="${{ matrix.distribution }}" \
            -f tests/installer/Dockerfile -t threatfusion-installer tests/installer

      - name: Install twice and verify real local UI and shutdown
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/source:ro" threatfusion-installer bash -c '
            set -euo pipefail
            ! command -v python
            ! command -v python3
            ! command -v git
            install_root="/home/installer/ThreatFusion Data"
            for attempt in 1 2; do
              bash /source/scripts/install_linux.sh --source-dir /source \
                --install-dir "$install_root" --prepare-only --no-browser
            done
            python=( "$install_root"/environments/*/bin/python )
            "${python[0]}" /source/scripts/check_linux_installation.py --install-dir "$install_root"
          '

  quality:
    name: "Quality (Ubuntu): Ruff + pytest + coverage + pip-audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.in
          python -m pip install --no-deps -e .

      - name: Verify package and CLI entry point
        run: |
          python -c "import importlib.metadata as m; print(m.version('threatfusion-ai'))"
          threatfusion --help
          threatfusion-collect --help

      - name: Run Ruff
        run: python -m ruff check .

      - name: Audit public-release secrets and local paths
        run: python scripts/audit_public_release.py --history

      - name: Run pytest
        run: python -m pytest --cov=threatfusion --cov-report=term-missing --cov-report=xml

      - name: Run pip-audit
        run: python -m pip_audit -r requirements.txt

  windows-pytest:
    name: Pytest (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.in
          python -m pip install --no-deps -e .

      - name: Verify package and CLI entry point
        run: |
          python -c "import importlib.metadata as m; print(m.version('threatfusion-ai'))"
          threatfusion --help

      - name: Run pytest
        run: python -m pytest

  container-smoke:
    name: Docker build + health
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t threatfusion-ci .

      - name: Start container with safe public default
        run: |
          docker run -d --name threatfusion-ci -p 127.0.0.1:8501:8501 \
            -e THREATFUSION_MODEL_SHA256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            threatfusion-ci

      - name: Verify container security defaults
        run: |
          docker exec threatfusion-ci sh -c 'test "$THREATFUSION_PUBLIC_MODE" = "1"'
          docker exec threatfusion-ci sh -c 'test -n "$THREATFUSION_MODEL_SHA256"'
          docker exec threatfusion-ci sh -c 'test ! -w /app/streamlit_app.py'
          docker exec threatfusion-ci sh -c 'test ! -w /app/src/threatfusion'
          docker exec threatfusion-ci sh -c 'test -w /app/runtime'
          docker exec threatfusion-ci sh -c 'test -w /app/data'
          docker exec threatfusion-ci python -c "import importlib.util; assert importlib.util.find_spec('pytest') is None; assert importlib.util.find_spec('ruff') is None"

      - name: Wait for Streamlit health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs threatfusion-ci
          exit 1

      - name: Clean up container
        if: always()
        run: docker rm -f threatfusion-ci || true

  public-demo-smoke:
    name: Synthetic public demo + proxy limits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build synthetic demo image
        run: docker build -f Dockerfile.public-demo -t threatfusion-public-demo .

      - name: Start isolated demo
        run: docker run -d --name threatfusion-public-demo -p 127.0.0.1:18501:10000 threatfusion-public-demo

      - name: Verify read-only synthetic runtime and privacy boundary
        run: |
          docker exec threatfusion-public-demo sh -c 'test "$(id -u)" = "10001"'
          docker exec threatfusion-public-demo sh -c 'test ! -w /app/runtime/models/development-001/model.joblib'
          docker exec threatfusion-public-demo sh -c 'test ! -w /app/public-demo.sha256'
          docker exec threatfusion-public-demo sh -c 'test ! -e /app/data/threatfusion.sqlite && test ! -e /app/.git && test ! -e /app/tests'

      - name: Verify health, headers, body limit and request limit
        run: python scripts/check_public_demo_proxy.py --base-url http://127.0.0.1:18501

      - name: Verify real Streamlit session through the proxy
        run: docker exec threatfusion-public-demo python scripts/check_public_demo_session.py

      - name: Show startup logs on failure
        if: failure()
        run: docker logs --tail 30 threatfusion-public-demo

      - name: Clean up demo
        if: always()
        run: docker rm -f threatfusion-public-demo || true
