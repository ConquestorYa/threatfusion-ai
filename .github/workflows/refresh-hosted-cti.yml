name: Refresh hosted CTI

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-render-refresh:
    name: Trigger hosted CTI rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook when configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not configured; scheduled refresh skipped."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Scheduled hosted CTI rebuild triggered."
