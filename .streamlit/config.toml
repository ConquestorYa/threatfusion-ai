[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[server]
maxUploadSize = 100
# Serves ./static (bundled fonts only) on the same loopback origin.
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
# No fixed base: Streamlit offers Light and Dark below (default follows the
# operating system). The in-app picker switches Streamlit's own theme so
# native widgets and the product palette always match. Keep these values in
# sync with THEME_PALETTES in src/threatfusion/ui_theme.py (tests check this).
# IBM Plex (OFL-1.1) is bundled under static/fonts; system fonts are fallbacks.
font = "IBM Plex Sans, system-ui, sans-serif"
codeFont = "IBM Plex Mono, ui-monospace, monospace"
baseRadius = "small"
showSidebarBorder = true

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-400-normal.woff2"
weight = 400
style = "normal"
unicodeRange = "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"

