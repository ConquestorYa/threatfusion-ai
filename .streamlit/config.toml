[server]
maxUploadSize = 10

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#22D3EE"
chartCategoricalColors = [
    "#FF5C6C",
    "#F59E0B",
    "#F6C85F",
    "#35D07F",
    "#22D3EE",
    "#60A5FA",
]
showSidebarBorder = true

[theme.dark]
