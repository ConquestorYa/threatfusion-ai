[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "threatfusion-ai"
version = "0.1.0"
description = "AI-assisted multi-source cyber threat intelligence and DNS threat-analysis platform."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "ConquestorYa" },
]
dependencies = [
  "joblib==1.6.0",
  "numpy==2.5.3",
  "pandas==3.0.6",
  "plotly==7.1.0",
  "requests==2.34.2",
  "scikit-learn==1.9.1",
  "streamlit==1.64.0",
]

[project.scripts]
threatfusion = "threatfusion.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
